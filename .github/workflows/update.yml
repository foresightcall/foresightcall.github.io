  - uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Build predictions
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    run: python scripts/update_predictions.py

  - name: Save changes
    run: |
      if [ -n "$(git status --porcelain data/predictions.json)" ]; then
        git config user.name "predictions-bot"
        git config user.email "predictions-bot@users.noreply.github.com"
        git add data/predictions.json
        git commit -m "Update predictions"
        git push
      else
        echo "Nothing new to save."
      fi
